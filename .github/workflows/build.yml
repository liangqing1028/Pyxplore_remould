name: Desktop validation and installers
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      TF_USE_LEGACY_KERAS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify frozen application source
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          paths = sorted(Path("wpem_desktop").rglob("*.py")) + [Path("pyproject.toml")]
          files = {path.as_posix(): hashlib.sha256(path.read_bytes()).hexdigest() for path in paths}
          digest = hashlib.sha256(json.dumps(files, sort_keys=True).encode()).hexdigest()
          assert digest == "d167edf85c76e5b3492cc2a7379b252f1529bbcbc131d3da00742a5e390a5ac8", "Application source differs from the validated snapshot"
          report = {"aggregate_sha256": digest, "files": files, "version": "0.1.2", "commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"]}
          Path("outputs").mkdir(exist_ok=True)
          Path("outputs/build-source.json").write_text(json.dumps(report, sort_keys=True, indent=2), encoding="utf-8")
          print("Verified frozen application source:", digest)
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full,dev]"
      - run: python -m pytest -q
      - run: python scripts/prepare_bundle.py
      - run: python -m PyInstaller --noconfirm packaging/desktop.spec
      - name: Verify packaged worker and GUI
        run: python scripts/check_bundle.py
      - name: Package installers
        run: python scripts/package_installers.py
      - uses: actions/upload-artifact@v4
        with:
          name: PyWPEMDesktop-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            outputs/build-source.json
            outputs/bundle-check.json
            outputs/bundle-smoke.png
            outputs/bundle-interactive.png
            outputs/packaged-science.xml
            outputs/packaged-science.log
          if-no-files-found: error
